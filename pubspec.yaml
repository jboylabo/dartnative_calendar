name: dartnative_calendar
description: >-
  Reusable month, week, day, and agenda calendar views for DartNative apps,
  with per-date event indicators, time-grid layout, and overlap handling.
version: 0.1.0
homepage: https://github.com/jboylabo/dartnative_calendar
repository: https://github.com/jboylabo/dartnative_calendar

environment:
  sdk: ^3.12.0-192.0.dev

# Plain version dep: `dn pub get` resolves the DartNative framework from your
# installed SDK (closed resolution) — no registry setup, works offline.
dependencies:
  dartnative: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
